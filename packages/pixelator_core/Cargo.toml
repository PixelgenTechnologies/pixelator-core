[package]
name = "pixelator-core"
version.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.5.48", features = ["derive"] }
sprs = "0.11.3"
rand = "0.9.2"
indicatif = { version = "0.18.0", features = ["rayon"] }
ndarray = "0.16.1"
rustc-hash = "2.1.1"
csv = "1.3.1"
env_logger = "0.11.8"
log = "0.4.28"
num-traits = "0.2.19"
is_close = "0.1.3"
rayon = "1.11.0"
smallvec = "1.15.1"
itertools = "0.14.0"
parquet = "58.1.0"
arrow = "58.1.0"
mimalloc = "0.1.48"
paraseq = "0.4.13"
serde = { version = "1.0.228", features = ["derive"] }
serde-saphyr = { version = "0.0.27", default-features = false, features = ["deserialize"] }

[features]
default = []
experimental = []
# Compiles `test_fixtures` outside `cfg(test)`, so benches can load the bundled
# assay and panel. Unit tests see the module without this feature.
test-fixtures = []

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.24.0"
# Benches are not `cfg(test)`, so they reach `test_fixtures` through this feature.
pixelator-core = { path = ".", features = ["test-fixtures"] }

[[bench]]
name = "pixelator-core-benchmarks"
harness = false
path = "benches/main.rs"
