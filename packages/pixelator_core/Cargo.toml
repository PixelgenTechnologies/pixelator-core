[package]
name = "pixelator-core"
version.workspace = true
edition = "2024"
# Bench modules sit next to `benches/main.rs`; without this, Cargo would treat
# each of those files as its own bench target.
autobenches = false

[dependencies]
clap.workspace = true
sprs = "0.11.6"
rand = "0.10.4"
indicatif = { workspace = true, features = ["rayon"] }
ndarray = "0.17.2"
rustc-hash.workspace = true
csv = "1.4.0"
env_logger.workspace = true
log.workspace = true
num-traits = "0.2.19"
is_close = "0.1.3"
rayon.workspace = true
smallvec = "1.16.6"
itertools.workspace = true
parquet = "60.2.0"
arrow = "60.2.0"
mimalloc.workspace = true
paraseq = "0.6.3"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "2.2.0", default-features = false, features = ["deserialize"] }

[features]
default = []
experimental = []
# Compiles `test_fixtures` outside `cfg(test)`, so benches can load the bundled
# assay and panel. Unit tests see the module without this feature.
test-fixtures = []

[dev-dependencies]
divan = "0.1.21"
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }
tempfile = "3.27.0"
# Benches are not `cfg(test)`, so they reach `test_fixtures` through this feature.
pixelator-core = { path = ".", features = ["test-fixtures"] }

[[bench]]
name = "pixelator-core-benchmarks"
harness = false
path = "benches/main.rs"
