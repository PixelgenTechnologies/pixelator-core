[package]
name = "pixelator-core"
version.workspace = true
edition = "2024"

[dependencies]
clap = { version = "4.6.7", features = ["derive"] }
sprs = "0.11.6"
rand = "0.9.5"
indicatif = { version = "0.18.6", features = ["rayon"] }
ndarray = "0.16.1"
rustc-hash = "2.1.3"
csv = "1.4.0"
env_logger = "0.11.11"
log = "0.4.34"
num-traits = "0.2.19"
is_close = "0.1.3"
rayon = "1.12.0"
smallvec = "1.15.2"
itertools = "0.14.0"
parquet = "58.4.0"
arrow = "58.4.0"
mimalloc = "0.1.52"
paraseq = "0.4.14"
serde = { version = "1.0.229", features = ["derive"] }
serde-saphyr = { version = "0.0.27", default-features = false, features = ["deserialize"] }

[features]
default = []
experimental = []
# Compiles `test_fixtures` outside `cfg(test)`, so benches can load the bundled
# assay and panel. Unit tests see the module without this feature.
test-fixtures = []

[dev-dependencies]
divan = "0.1.21"
tempfile = "3.27.0"
# Benches are not `cfg(test)`, so they reach `test_fixtures` through this feature.
pixelator-core = { path = ".", features = ["test-fixtures"] }

[[bench]]
name = "pixelator-core-benchmarks"
harness = false
path = "benches/main.rs"
