[package]
name = "pixelator_core_py"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
paste = "1.0.15"
numpy = "0.30.0"
pixelator-core.workspace = true
pyo3 = { version = "0.30", features = ["extension-module"] }
pyo3-log = "0.13.5"
rayon.workspace = true
itertools.workspace = true
log.workspace = true
rustc-hash.workspace = true
flate2 = { version = "1.1.11", default-features = false, features = ["zlib-rs"] }

# Not used as the global allocator on macOS. PyArrow ships its own mimalloc, and
# loading both into one process corrupts per-thread heap pointers. See the
# allocator comment in src/lib.rs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc.workspace = true

[features]
default = []
