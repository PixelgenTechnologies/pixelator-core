[package]
name = "pixelator_core_py"
version.workspace = true
edition = "2021"

[lib]
crate-type = ["cdylib"]

[dependencies]
paste = "1.0.15"
pixelator-core = { path = "../pixelator_core" }
pyo3 = { version = "0.26", features = ["extension-module"] }
pyo3-log = "0.13.4"
log = "0.4.34"
rustc-hash = "2.1.3"
flate2 = { version = "1.1.10", default-features = false, features = ["zlib-rs"] }

# Not used as the global allocator on macOS. PyArrow ships its own mimalloc, and
# loading both into one process corrupts per-thread heap pointers. See the
# allocator comment in src/lib.rs.
[target.'cfg(not(target_os = "macos"))'.dependencies]
mimalloc = "0.1.52"

[features]
default = []
