[workspace]
members = ["packages/cli", "packages/pixelator_core", "packages/python_bindings"]
resolver = "3"

# Single source of truth for Rust crates and Python wheels (maturin reads this via the crate).
# Prereleases use Cargo semver (e.g. 0.1.0-rc1); PEP 440 treats that as the same release as 0.1.0rc1.
[workspace.package]
version = "2.0.0"

# Dependencies used by more than one member. Members opt in with `dep.workspace = true`
# and may add features on top (e.g. `indicatif` with `rayon` in pixelator-core).
[workspace.dependencies]
pixelator-core = { path = "packages/pixelator_core" }
clap = { version = "4.6.10", features = ["derive"] }
env_logger = "0.11.12"
indicatif = "0.18.6"
itertools = "0.15.0"
log = "0.4.35"
mimalloc = "0.1.52"
rayon = "1.12.0"
rustc-hash = "2.1.3"

[profile.release]
opt-level = 3
codegen-units = 1
lto = "fat"

[profile.profiling]
inherits = "release"
debug = true
lto = false
codegen-units = 16     # More units = less cross-unit inlining
opt-level = 2
