name: wheels

on:
  release:
    types: [published]
  # Release PRs (opened by release-please) only build the wheels, to catch
  # packaging failures before the release is published. Uploading is limited
  # to the `release` event. Only release PRs change the manifest.
  pull_request:
    branches: [dev]
    paths: [.release-please-manifest.json]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify-release-version:
    name: verify package version
    runs-on: ubuntu-latest
    env:
      EVENT_NAME: ${{ github.event_name }}
    steps:
      - uses: actions/checkout@v6
      # Stop before building if the wheels would get the wrong version.
      #
      # Why: the wheel version is read from Cargo.toml, not from the git tag. If
      # release-please fails to bump Cargo.toml (it only logs a warning), a v1.1.0
      # release would publish 1.0.2 wheels, and PyPI does not allow re-uploads.
      #
      # What: compare the version in Cargo.toml with
      #   - on a release: the tag, without the "v" (v1.1.0 -> 1.1.0)
      #   - on a release PR: the version in .release-please-manifest.json
      - name: Check Cargo.toml version
        run: |
          set -euo pipefail
          actual=$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')
          if [ "${EVENT_NAME}" = "release" ]; then
            expected="${GITHUB_REF_NAME#v}"
          else
            expected=$(python3 -c 'import json; print(json.load(open(".release-please-manifest.json"))["."])')
          fi
          if [ "${actual}" != "${expected}" ]; then
            echo "::error::Cargo.toml has version ${actual}, expected ${expected}"
            exit 1
          fi
          echo "OK: Cargo.toml version ${actual}"

  build:
    name: build on ${{ matrix.os }} (${{ matrix.target }})
    needs: verify-release-version
    strategy:
      fail-fast: false
      matrix:
        os: [linux, macos, windows]
        target: [x86_64, aarch64]
        include:
          - os: linux
            manylinux: manylinux_2_28
          - os: macos
            manylinux: auto
          - os: windows
            manylinux: auto
        exclude:
          # GitHub-hosted Windows is x64; skip non-existent windows/aarch64 leg
          - os: windows
            target: aarch64

    runs-on: ${{ matrix.runs-on || format('{0}-latest', (matrix.os == 'linux' && 'ubuntu') || matrix.os) }}
    env:
      PYTHON_INTERPRETERS: 3.11 3.12 3.13
    steps:
      - uses: actions/checkout@v6
      - name: set up python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          architecture: ${{ matrix.python-architecture || 'x64' }}

      - name: build wheels (linux)
        if: matrix.os == 'linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter ${{ env.PYTHON_INTERPRETERS }}
          rust-toolchain: stable
          docker-options: |
            -e CI
          working-directory: ./packages/python_bindings
          sccache: true
          before-script-linux: |
            if [ "${{ matrix.target }}" = "x86_64" ]; then
              yum update -y
              yum install -y git gcc-c++ cmake ninja-build openssl-devel
            fi
            if [ "${{ matrix.target }}" = "aarch64" ]; then
              apt-get update -y
              apt-get install -y git g++ cmake ninja-build libssl-dev
            fi

      - name: build wheels (macos/windows)
        if: matrix.os != 'linux'
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          manylinux: ${{ matrix.manylinux }}
          args: --release --out dist --interpreter ${{ env.PYTHON_INTERPRETERS }}
          rust-toolchain: stable
          docker-options: -e CI
          working-directory: ./packages/python_bindings
          sccache: true

      - name: Upload wheels
        uses: actions/upload-artifact@v7
        with:
          name: python-wheels-${{ matrix.os }}-${{ matrix.target }}
          path: ./packages/python_bindings/dist/*.whl

  upload-release-assets:
    name: upload wheels to release
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Attach wheels to release
        uses: softprops/action-gh-release@v2
        with:
          files: ./artifacts/*.whl

  publish-pypi:
    name: publish wheels to PyPI
    needs: build
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: pypi
    steps:
      - name: Download wheel artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./artifacts
          merge-multiple: true

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ./artifacts
