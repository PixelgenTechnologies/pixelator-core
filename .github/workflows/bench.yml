name: benchmark

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev]

env:
  CARGO_TERM_COLOR: always

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    name: Benchmarks (cargo bench)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - uses: Swatinem/rust-cache@v2

      - name: Run benchmarks
        run: cargo bench --locked 2>&1 | tee output.txt

      - name: Convert divan output to json
        run: |
          python3 ${{ github.workspace }}/.github/scripts/divan2json.py output.txt bench_results.json
          cat bench_results.json

      # dev/bench is one point per push to dev. main/bench is one point per
      # release, because main only moves when a release is published. A push
      # publishes that point. A pull request only comments, so the chart stays
      # limited to commits that landed. Release-please PRs comment against the
      # release chart; every other PR comments against the dev chart.
      - name: Choose benchmark history
        id: history
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "pull_request" ] && [[ "${{ github.head_ref }}" == release-please--branches--* ]]; then
            echo "dir=main/bench" >> "$GITHUB_OUTPUT"
          elif [ "${{ github.event_name }}" = "pull_request" ]; then
            echo "dir=${{ github.base_ref }}/bench" >> "$GITHUB_OUTPUT"
          else
            echo "dir=${{ github.ref_name }}/bench" >> "$GITHUB_OUTPUT"
          fi

      - name: Store benchmark results (publish on push, comment on pull request)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Native Community Detection Benchmark
          tool: customSmallerIsBetter
          output-file-path: ${{ github.workspace }}/bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          benchmark-data-dir-path: ${{ steps.history.outputs.dir }}
          gh-pages-branch: "gh-page"
          comment-always: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "200%"
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
