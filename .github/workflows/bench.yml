name: benchmark

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main, dev]

env:
  CARGO_TERM_COLOR: always

permissions:
  pull-requests: write
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  benchmark:
    name: Benchmarks (cargo bench)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true

      - name: Setup caching
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}

      - name: Run benchmarks
        run: cargo bench --locked 2>&1 | tee output.txt

      - name: Convert divan output to json
        run: |
          python3 ${{ github.workspace }}/.github/scripts/divan2json.py output.txt bench_results.json
          cat bench_results.json

      # Both events compare against the history recorded on gh-page, but they
      # report it differently: a push publishes the new point silently, while a
      # pull request leaves the comparison as a review comment without
      # publishing. Commenting is off on push because there is no PR to comment
      # on, so the action would scatter comments over individual commits.
      - name: Store benchmark results (publish on push, comment on pull request)
        uses: benchmark-action/github-action-benchmark@v1
        with:
          name: Native Community Detection Benchmark
          tool: customSmallerIsBetter
          output-file-path: ${{ github.workspace }}/bench_results.json
          github-token: ${{ secrets.GITHUB_TOKEN }}
          auto-push: ${{ github.event_name == 'push' }}
          gh-pages-branch: "gh-page"
          comment-always: ${{ github.event_name == 'pull_request' }}
          alert-threshold: "200%"
          comment-on-alert: ${{ github.event_name == 'pull_request' }}
