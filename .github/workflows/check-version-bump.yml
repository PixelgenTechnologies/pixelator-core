name: check-version-bump

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo-version-bump:
    name: Cargo workspace version bump (dev -> main)
    if: ${{ github.head_ref == 'dev' }}
    runs-on: ubuntu-latest

    steps:
      # Full history so the check can see every release tag.
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install packaging

      - name: Check Cargo.toml workspace.package.version
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: python ${{ github.workspace }}/.github/scripts/check_version_bump.py
